name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  # Run all checks in a single job to share setup and caching
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Check Astro and TypeScript
        run: pnpm check

      - name: Run tests
        run: pnpm test:run

      - name: Build site
        run: pnpm build

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production site in desktop and mobile browsers
        run: pnpm test:e2e
